name: FeuilleBlanche
options:
  bundleIdPrefix: ch.yannickmauray
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: WFMP87LTRX

targets:
  FeuilleBlanche:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.yannickmauray.feuille-blanche
        DEVELOPMENT_TEAM: WFMP87LTRX
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Feuille blanche"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FeuilleBlancheTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FeuilleBlanche
    settings:
      base:
        DEVELOPMENT_TEAM: WFMP87LTRX
        GENERATE_INFOPLIST_FILE: YES
