name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Installer xcodegen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Build et tests
        run: |
          xcodebuild \
            -project FeuilleBlanche.xcodeproj \
            -scheme FeuilleBlanche \
            -destination "platform=iOS Simulator,id=dvtdevice-DVTiOSDeviceSimulatorPlaceholder-iphonesimulator:placeholder" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test
